# Progressive symbol map for Shadowrun.
#
# Each [[func]] names an address the analyzer should treat as a function.
# Set emit = true to promote one into ahead-of-time codegen; leave it false
# to keep it interpreted. tools/regen.sh syncs labels and tier choices into
# each recomp/bankNN.cfg; only emit=true adds a func/funcs.h declaration.
# Do not hand-edit the generated blocks in the bank configs.

[[func]]
name = "I_RESET"
addr = "e34c"
bank = 0
emit = true
note = "Emulation RESET vector ($FFFC)"

[[func]]
name = "I_NMI"
addr = "c0e2"
bank = 0
emit = true
note = "Native NMI vector ($FFEA)"

# --- promotion round 1 (2026-11-06): the B0 frontier -------------------------
#
# Every address below is the first byte of a 512-byte ROM block that the B0 read
# trace shows the interpreter taking INSTRUCTION bytes from (fetch seam: 26 blocks,
# 1,084,397,942 reads = 38.9 % of all ROM reads) and that sits inside no span the
# analyzer had ever covered (src/gen/program_manifest.json then held 226 nodes over
# 66 blocks). The recompiler could not promote them because it had no root there.
# Seeds come from tests/frontier_seeds.py; three blocks under 1,024 fetch reads were
# held back as too small to trust as code. Addresses are bus addresses, so bit 15 is
# set: LoROM maps a cart bank at $8000-$FFFF only, and a below-$8000 address is not
# ROM at all - the analyzer answers those with empty_decode.
#
# Result of this round, measured: the frontier closes (26 blocks -> 3, the rest under
# the trust floor), but 20 of these 23 roots are refused as lle_only by named
# structural reasons (brk_at_*, truncated_call_continuation, unproven_call_at_*), and
# several decode to BRK at the declared byte - the block start is not an entry there.
# 3 seeds promoted; 8 new AOT bodies total, the rest continuations beside the seeds.
# Traffic byte-identical, horizon unmoved, combat AOT share 3.73 -> 3.94 % cycles:
# evidence/m2_promotion_round1.md. Closing the structural reasons is round 2, and its
# seeds are the callee addresses named in the refusals, not more read-trace blocks.
[[func]]
name = "FR_808000"
addr = "8000"
bank = 0x80
emit = true
note = "promotion round seed: B0 trace fetched 12,110,295 reads at $80:8000"

[[func]]
