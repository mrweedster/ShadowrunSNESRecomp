# --- M2 promotion round 4 (gap-driven seeds) ---------------------------------
#
# Rounds 1-2 seeded from the read trace (tests/frontier_seeds.py), a source
# retired at 0.0 % of reads left. Round 3 measured what the interpreted residue
# is instead (evidence/m2_promotion_round3.md): 28,131,074 of 919,307,323
# attributed interpreted guest cycles sit at a transfer gap the bridge could
# hand a body to, and the other 96.94 % is entered by fall-through, back-edge
# or resume, where no seed at any address intercepts it.
#
# The 2 entries below are the top of that ranking as tests/coverage_gaps.py
# ranks it, emitted by tests/gap_seeds.py from tier2_capture_round3_combat.json
# over combat, and 4 sighted entries already have an entry at that address and
# mode, so they are left out. Every number in a note is the capture's own for
# that address, not a guess.
#
#   This block is a subset of the ranking, emitted with --only $80C399,$80AAB3:
#   2 of the 229 kept entries survive it, and they gate 3,680,454 cyc. The
#   ceiling figures below still describe the full ranking.
#
#   capture identity  program_digest 240af24bb4a71049  generation_digest
#   4e902f1ff9bdca6f
#   rom_sha256 e6bc0a595d5c7c4b  mapper lorom  captures 1  warnings []
#   these 2 ranking seeds gate 3,680,454 cyc = 0.40 % of the residue, 13.1 % of
#   what is seedable (top 10 = 1.62 %, top 50 = 2.71 %, all 229 kept entries =
#   3.06 %): the knee is at the top of the list, so a round that stops here is
#   not leaving money on the table

