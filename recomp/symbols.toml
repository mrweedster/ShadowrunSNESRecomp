# --- M2 promotion round 2 (2026-11-07): the callees the refusals named -------------
#
# Round 1 closed the fetch frontier but 20 of its 23 roots were refused as lle_only,
# each with an `unproven_call_at_<site>_to_<callee>_m<m>x<x>`. reason naming a callee
# the recompiler had no entry for (evidence/m2_promotion_round1.md 2). The 15 addresses
# below are the ones from those 20 callee names that this file did not already declare;
# every one of them is an address a round-1 refusal asked for, so this round asks for
# the OTHER half of the frontier rather than more read-trace blocks. Nothing here is a
# new idea from the trace: tests/frontier_seeds.py now reports 3 blocks left (1,820
# reads, 0.0 % of 2,785,987,594) and all three are below the round's 1,024-read floor,
# so the read-trace seed source is retired.
#
# entry_m/entry_x are stated where they are NOT the default (1,1), because the demand
# modes come from the refusals themselves: 6 of these callees are demanded in m1x1 and
# 9 in m0x0. A seed with the wrong entry mode would create a variant nobody calls.
#
# Outcome, measured (evidence/m2_promotion_round2.md): the round yields 4 new AOT
# bodies - m1x1 variants of 80FA31, 80FA76, 81AC79, 81B05D, 45 instructions, of which
# 80FA76 and 81AC79 are callees the refusals named but that did not need an entry here -
# and 11 more lle_only nodes with reasons; nothing observable in execution moved (both
# paths byte-identical to round 1). Two seeds are gone as of round 2b: $80:7FA9 and
# $AB:2FAB are callees the analyzer resolves `lle_exact` into memory the cart's LoROM
# mapping does not back at all ($80:7FA9 is below $8000 in a low canonical bank;
# $AB:2FAB maps to cart offset $15AFAB, past the 1 MiB image, and Shadowrun is not an
# SA-1 card). No seed can promote those, and a seed for them only adds a dispatch row
# whose four variant slots are all NULL. The other three addresses of that shape
# ($80:01A9, $80:0AAD, $80:3230) appear only in the refusal strings, not here. The rule
# for future rounds: check the demand's `resolution` first - `aot_exact` can be
# converted by a seed, `lle_exact` cannot.

[[func]]
name = "CC_80A568"
addr = "A568"
bank = 0x80
emit = true
note = "round-2 seed: already aot at m0x0; this is the m1x1 variant the refusals ask for"

