# Shadowrun translations — LLE-first seed set (bank 0).
#
# The German and Swedish releases are different programs from the USA ROM:
# the code and data were moved to make room for the translated text, so the
# USA symbol addresses in recomp/symbols.toml point into the middle of other
# routines. Feeding those addresses to the recompiler produced AOT blocks the
# translated ROM never enters; a German build made that way went off the rails
# (architectural BRK) a few seconds into the first scene.
#
# This directory therefore carries only the ROM-agnostic directives. The
# analyzer still seeds the reset and NMI vectors from the cartridge header
# (`auto_vectors`) and follows their call graph, so the translations get a
# correct AOT set derived from their own bytes — 213 variants from 9 roots,
# measured — and everything else runs on the interpreter.
#
# Do not add USA addresses here. If a translation needs a seed, take it from
# that ROM's own disassembly and add it to a translation-specific symbols file.
bank = 0
auto_vectors
tier_down_stubs
